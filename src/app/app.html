@if (auth.isLoggedIn()) {
  <header class="top">
    <a routerLink="/shift-summary" class="brand">POS System</a>
    <nav class="main-nav" aria-label="Glavna navigacija">
      <a
        routerLink="/shift-summary"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Smjena</a
      >
      <a routerLink="/customers" routerLinkActive="active">Kupci</a>
    </nav>
    <div class="right">
      <span class="muted">{{ auth.user()?.fullName }}</span>
      <div>
        <button hlmBtn variant="destructive" (click)="auth.logout()">Odjava</button>
      </div>
    </div>
  </header>
  <main class="container"><router-outlet /></main>
} @else {
  <router-outlet />
}
